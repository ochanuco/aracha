name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: ochanuco/.github/.github/workflows/pnpm.yml@781255530e060ff35b956a9b417d4c4ec6bfa970 # v1.7.1
    with:
      run: |
        pnpm run typecheck
        pnpm test
